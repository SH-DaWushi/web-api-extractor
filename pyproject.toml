[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-api-extractor"
version = "0.1.0"
description = "Extract web APIs into a local FastMCP server"
readme = "README.md"
# 自拟条款，非 SPDX/OSI 许可：显式声明让元数据与 LICENSE 一致。
# 注意 GitHub 的许可识别器认不出它，About 面板不会显示许可徽章。
license = { file = "LICENSE" }
authors = [{ name = "SH-DaWushi" }]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "playwright>=1.45",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
web-api-extractor = "webapi_extractor.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["webapi_extractor*"]