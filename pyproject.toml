[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scry-mcp-gen"
version = "0.2.0"
description = "Extract web APIs into a local FastMCP server"
readme = "README.md"
# 自拟条款，非 SPDX/OSI 许可：显式声明让元数据与 LICENSE 一致。
# 注意 GitHub 的许可识别器认不出它，About 面板不会显示许可徽章。
license = { file = "LICENSE" }
authors = [{ name = "SH-DaWushi" }]
requires-python = ">=3.10"
# 与 requirements.txt 保持**同一组约束**（含上界）：两处写着不同的范围时，
# `pip install -e .` 与 `pip install -r requirements.txt` 会装出不同的依赖图，
# 而 fastmcp 5.x 已经改过 server 侧的导入路径（实测 ImportError）。
dependencies = [
    "fastmcp>=2.3,<5",
    "httpx>=0.27",
    "playwright>=1.45,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
]

# 测试依赖与运行时依赖分离：`pip install -e .`（或 bootstrap.py 的默认路径）不装 pytest，
# 只有 `pip install -e ".[test]"` 或 `bootstrap.py --with-tests` 才会。
# 与 requirements-dev.txt 保持同一组版本约束。
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
scry = "scry_mcp_gen.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["scry_mcp_gen*"]