[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-api-extractor"
version = "0.1.0"
description = "Extract web APIs into a local FastMCP server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.45",
]

[project.scripts]
web-api-extractor = "webapi_extractor.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["webapi_extractor*"]